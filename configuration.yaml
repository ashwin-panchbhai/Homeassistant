# =========================================================================
# HOME ASSISTANT CORE DEFINITIONS
# =========================================================================
default_config:

frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
# =========================================================================
# POWERCALC INTEGRATION VIRTUAL METER ENGINE
# =========================================================================
powercalc:
  sensors:
    # --- 1. HALL FAN LEFT ---
    - entity_id: fan.hall_two
      unique_id: powercalc_hall_fan_left
      name: "Hall Fan Left Consumption"
      mode: fixed
      create_energy_sensor: true
      ignore_unavailable_state: false
      fixed:
        power: >
          {% if is_state('device_tracker.espressif_e9_24_e0', 'home') %}
            {% set p = state_attr('fan.hall_two', 'percentage') | int(0) %}
            {% if is_state('fan.hall_two', 'off') %} 0.5
            {% elif p == 16 %} 3.8
            {% elif p == 33 %} 7.7
            {% elif p == 50 %} 13.8
            {% elif p == 66 %} 22.7
            {% elif p == 83 %} 28.0
            {% elif p == 100 %} 35.0
            {% else %} 0.5 {% endif %}
          {% else %} 0.0 {% endif %}

    # --- 2. HALL FAN RIGHT ---
    - entity_id: fan.hall_one
      unique_id: powercalc_hall_fan_right
      name: "Hall Fan Right Consumption"
      mode: fixed
      create_energy_sensor: true
      ignore_unavailable_state: false
      fixed:
        power: >
          {% if is_state('device_tracker.espressif_54_a0_7c', 'home') %}
            {% set p = state_attr('fan.hall_one', 'percentage') | int(0) %}
            {% if is_state('fan.hall_one', 'off') %} 0.5
            {% elif p == 16 %} 3.8
            {% elif p == 33 %} 7.7
            {% elif p == 50 %} 13.8
            {% elif p == 66 %} 22.7
            {% elif p == 83 %} 28.0
            {% elif p == 100 %} 35.0
            {% else %} 0.5 {% endif %}
          {% else %} 0.0 {% endif %}

    # --- 3. K FAN ---
    - entity_id: fan.k_fan
      unique_id: powercalc_k_fan
      name: "K Fan Consumption"
      mode: fixed
      create_energy_sensor: true
      ignore_unavailable_state: false
      fixed:
        power: >
          {% if is_state('device_tracker.espressif_4c_73_ec', 'home') %}
            {% set p = state_attr('fan.k_fan', 'percentage') | int(0) %}
            {% if is_state('fan.k_fan', 'off') %} 0.5
            {% elif p == 16 %} 3.8
            {% elif p == 33 %} 7.7
            {% elif p == 50 %} 13.8
            {% elif p == 66 %} 22.7
            {% elif p == 83 %} 28.0
            {% elif p == 100 %} 35.0
            {% else %} 0.5 {% endif %}
          {% else %} 0.0 {% endif %}

    # --- 4. KITCHEN FAN ---
    - entity_id: fan.kitchen_fan
      unique_id: powercalc_kitchen_fan
      name: "Kitchen Fan Consumption"
      mode: fixed
      create_energy_sensor: true
      ignore_unavailable_state: false
      fixed:
        power: >
          {% if is_state('device_tracker.espressif_4b_e6_c4', 'home') %}
            {% set p = state_attr('fan.kitchen_fan', 'percentage') | int(0) %}
            {% if is_state('fan.kitchen_fan', 'off') %} 0.5
            {% elif p == 16 %} 3.8
            {% elif p == 33 %} 7.7
            {% elif p == 50 %} 13.8
            {% elif p == 66 %} 22.7
            {% elif p == 83 %} 28.0
            {% elif p == 100 %} 35.0
            {% else %} 0.5 {% endif %}
          {% else %} 0.0 {% endif %}

    # --- 5. BEDROOM FAN ---
    - entity_id: fan.fan
      unique_id: powercalc_bedroom_fan
      name: "Bedroom Fan Consumption"
      mode: fixed
      create_energy_sensor: true
      ignore_unavailable_state: false
      fixed:
        power: >
          {% if is_state('device_tracker.espressif_65_e2_34', 'home') %}
            {% set p = state_attr('fan.fan', 'percentage') | int(0) %}
            {% if is_state('fan.fan', 'off') %} 0.5
            {% elif p == 16 %} 3.8
            {% elif p == 33 %} 7.7
            {% elif p == 50 %} 13.8
            {% elif p == 66 %} 22.7
            {% elif p == 83 %} 28.0
            {% elif p == 100 %} 35.0
            {% else %} 0.5 {% endif %}
          {% else %} 0.0 {% endif %}

    # --- 6. SONY BRAVIA 49" TV ---
    - entity_id: media_player.tv_3
      unique_id: sony_tv_consumption_dynamic
      name: "TV Consumption"
      mode: fixed
      create_energy_sensor: true
      fixed:
        power: >
          {% set tv_state = states('media_player.tv_3') | default('') | trim | lower %}
          {% set active_app = states('sensor.sony_tv_active_app') | default('') | trim %}
          {% if tv_state in ['off', 'standby', 'unavailable', 'unknown'] %}
            0.5
          {% elif tv_state in ['on', 'playing', 'idle', 'paused', 'buffering'] %}
            {% if active_app == 'Gaming Mode' %} 125.0
            {% elif active_app in ['JioHotstar / Live TV', 'JioTV', 'Netflix', 'Prime Video', 'Castle'] %} 110.0
            {% elif active_app in ['YouTube', 'Spotify'] %} 85.0
            {% else %} 65.0 {% endif %}
          {% else %}
            0.5
          {% endif %}

    # --- 6B. SONY TV APP DIAGNOSTIC LINKED METER ---
    - entity_id: sensor.sony_tv_active_app
      unique_id: powercalc_sony_tv_app_sensor_diagnostic
      name: "Sony TV App Sensor Power Monitor"
      mode: fixed
      create_energy_sensor: false
      fixed:
        states_power:
          "Home Screen": 65.0
          "Gaming Mode": 125.0
          "YouTube": 85.0
          "Spotify": 85.0
          "JioHotstar / Live TV": 110.0
          "JioTV": 110.0
          "Netflix": 110.0
          "Prime Video": 110.0
          "Castle": 110.0
          "Off": 0.5

    # --- 7. LG QUADWASH DISHWASHER (ENTERPRISE-GRADE SPECIFICATIONS) ---
    - entity_id: sensor.dishwasher
      unique_id: powercalc_lg_dishwasher
      name: "LG Dishwasher Consumption"
      mode: fixed
      create_energy_sensor: true
      ignore_unavailable_state: false
      fixed:
        power: >-
          {% set dishwasher_state = states('sensor.dishwasher') | default('') | trim | lower %}
          {% set proc_state = states('sensor.dishwasher_process_state') | default('') | trim | lower %}
          {% set countdown = states('sensor.dishwasher_countdown_time') | default('') | trim %}
          {% set current_course = states('sensor.dishwasher_current_course') | default('') | trim | lower %}
          {% if dishwasher_state in ['unavailable', 'unknown'] or proc_state in ['unavailable', 'unknown'] %}
            0.0
          {% elif countdown in ['0:00:00', '0:00', '0'] %}
            0.5
          {% elif (states('binary_sensor.dishwasher_auto_door') | default('') | trim | lower) in ['on', 'open', 'true'] and proc_state in ['off', '-', 'standby', 'draining'] %}
            4.2
          {% elif dishwasher_state in ['off', 'power_off', 'power_fail', 'end', 'initial'] or proc_state in ['off', '-', 'standby'] %}
            0.5
          {% elif dishwasher_state == 'pause' %}
            3.8
          {% elif proc_state in ['rinsing', 'rinse'] or current_course == 'rinse' %}
            65.0
          {% elif proc_state in ['dry', 'drying', 'night dry', 'night_dry'] %}
            30.0
          {% elif proc_state in ['washing', 'wash'] %}
            {% set course = current_course %}
            {% if course == 'eco' %} 850.0
            {% elif course == 'auto' %} 1200.0
            {% elif course in ['turbo', 'express'] %} 1450.0
            {% elif course == 'intensive' %} 1650.0
            {% else %} 1200.0
            {% endif %}
          {% else %}
            1.2
          {% endif %}

    # --- 8. NOKIA G-140W-F GATEWAY ROUTER (DYNAMIC TRAFFIC LOAD) ---
    - entity_id: device_tracker.nokia_shanghai_bell_c2_07_10
      unique_id: powercalc_nokia_router
      name: "Nokia Router Consumption"
      mode: fixed
      create_energy_sensor: true
      ignore_unavailable_state: false
      fixed:
        power: >
          {% set speed = states('sensor.internet_home_gateway_device_download_speed') | float(0.0) %}
          {% if speed <= 10.0 %}
            7.0
          {% elif speed > 10.0 and speed <= 500.0 %}
            8.5
          {% elif speed > 500.0 and speed <= 5000.0 %}
            9.8
          {% else %}
            11.5
          {% endif %}

    # --- 9. TAPO C-225 SECURITY CAMERA (MOTION & PRIVACY PROFILE) ---
    - entity_id: camera.door_hd_stream
      unique_id: powercalc_tapo_camera_c225
      name: "Tapo Camera Consumption"
      mode: fixed
      create_energy_sensor: true
      ignore_unavailable_state: true
      fixed:
        power: >-
          {% set cam = states('camera.door_hd_stream') | default('') | trim | lower %}
          {% set privacy = states('binary_sensor.door_privacy_mode') | default('') | trim | lower %}
          {% set motion = states('binary_sensor.door_motion') | default('') | trim | lower %}
          {% if cam in ['unavailable', 'unknown'] %}
            0.0
          {% elif privacy == 'on' %}
            1.8
          {% elif motion == 'on' %}
            3.5
          {% else %}
            0.8
          {% endif %}

    # --- 10. HIKVISION INDOOR STATION SCREEN (COMPACT STATE PROFILE) ---
    - entity_id: device_tracker.fn_link_technology_88_65_c3
      unique_id: powercalc_hikvision_indoor_screen
      name: "Hikvision Camera Screen Consumption"
      mode: fixed
      create_energy_sensor: true
      ignore_unavailable_state: false
      fixed:
        power: >
          {% set tracker_state = states('device_tracker.fn_link_technology_88_65_c3') | default('') | trim | lower %}
          {% set call_status = states('sensor.embedded_net_vis_call_status') | default('') | trim | lower %}
          {% if tracker_state in ['unavailable', 'unknown', 'not_home'] or call_status in ['unavailable', 'unknown'] %}
            1.5
          {% elif tracker_state != 'home' %}
            0.0
          {% else %}
            {% if call_status in ['ringing', 'talk', 'call', 'active'] %}
              6.0
            {% elif call_status == 'idle' %}
              4.0
            {% else %}
              1.5
            {% endif %}
          {% endif %}

    # --- 12. SAMSUNG WASHER PRODUCTION CONFIG ----
    - entity_id: sensor.washer_machine_state
      unique_id: samsung_washer_powercalc
      name: "Samsung Washer Powercalc"
      mode: fixed
      create_energy_sensor: true
      ignore_unavailable_state: true
      fixed:
        power: >-
          {% set machine = states('sensor.washer_machine_state') | default('') | trim | lower %}

          {# #1. Machine completely Off or disconnected #}
          {% if machine in ['unavailable', 'unknown', 'none', 'stop', 'stopped'] %}
            0.0

          {# 2. Machine is On but paused/idle #}
          {% elif machine == 'pause' %}
            4.0

          {# 3. Machine is actively executing a cycle #}
          {% elif machine == 'run' %}
            {% set job = states('sensor.washer_job_state') | default('') | trim | lower %}
            {% set temp = states('select.washer_water_temperature') | default('') | trim | lower %}
            {% set spin = states('select.washer_spin_level') | default('') | trim | lower %}

            {# Phase A: Weighing/Sensing initial load #}
            {% if job in ['weight_sensing', 'none'] %}
              60.0

            {# Phase B: Washing with High Hot Water Temp (Heater Active) #}
            {% elif job in ['wash', 'pre_wash', 'delay_wash'] and temp in ['60', '90'] %}
              1800.0
            {% elif job in ['wash', 'pre_wash', 'delay_wash'] and temp == '40' %}
              1000.0

            {# Phase C: Washing with Cold / Eco Temperature #}
            {% elif job in ['wash', 'pre_wash', 'delay_wash'] %}
              150.0

            {# Phase D: High Speed Spinning extraction #}
            {% elif job in ['spin', 'ai_spin'] and spin in ['1000', '1200', '1400'] %}
              450.0
            {% elif job in ['spin', 'ai_spin'] %}
              250.0

            {# Phase E: Rinsing, Pump discharging, and Cooling #}
            {% elif job in ['rinse', 'ai_rinse', 'cooling'] %}
              80.0

            {# Phase F: Finished cycle, standing by / wrinkle prevention tumbling #}
            {% elif job in ['finish', 'wrinkle_prevent'] %}
              45.0
            {% else %}
              150.0
            {% endif %}

          {# Fallback #}
          {% else %}
            0.5
          {% endif %}

# =========================================================================
# TEMPLATE SENSORS ENGINE (COMPUTATIONS & CALCULATIONS)
# =========================================================================
template:
  - sensor:
      # --- LG DISHWASHER MAIN STATUS BRIDGES ---
      - name: "Dishwasher Current Status"
        unique_id: dishwasher_current_status
        icon: mdi:power
        state: >-
          {% set device = states('device_tracker.lg_innotek_ab_84_7c') | default('') | trim | lower %}
          {% set pwr = states('sensor.dishwasher') | default('') | trim | lower %}
          {% set run_state = states('sensor.dishwasher') | default('') | trim %}
          {% if device in ['unavailable', 'unknown', 'not_home'] or pwr in ['off', 'power_off'] %}
            Off
          {% elif pwr == 'on' and run_state not in ['unavailable', 'unknown', 'standby', 'none', '-', ''] %}
            {{ run_state }}
          {% else %}
            Standby
          {% endif %}

      - name: "Dishwasher Process State"
        unique_id: dishwasher_process_state_bridge
        icon: mdi:sync
        state: >-
          {% set process = states('sensor.dishwasher_process_state') | default('') | trim %}
          {% if process not in ['unavailable', 'unknown', 'none', ''] %}
            {{ process }}
          {% else %}
            -
          {% endif %}

      # --- DISHWASHER MICRO-MONITORING CORE ---
      - name: "Dishwasher Last Cycle Energy Consumption"
        unique_id: dishwasher_last_cycle_energy_consumption
        unit_of_measurement: "kWh"
        device_class: energy
        state: >-
          {% set current_status = states('sensor.dishwasher') | default('') | trim | lower %}
          {% set telemetry_energy = states('sensor.lg_dishwasher_consumption_energy') | float(none) %}
          {% set stored_cache = states('sensor.dishwasher_last_cycle_energy_consumption') | float(0.0) %}
          {% if current_status == 'end' and telemetry_energy is not none and telemetry_energy > 0.0 %}
            {{ telemetry_energy | round(3) }}
          {% else %}
            {{ stored_cache }}
          {% endif %}

      # --- DISHWASHER LAST CYCLE COST ENGINE ---
      - name: "Dishwasher Last Cycle Cost INR"
        unique_id: dishwasher_last_cycle_cost_inr
        icon: mdi:currency-inr
        unit_of_measurement: "INR"
        state: >-
          {% set kwh = states('sensor.dishwasher_last_cycle_energy_consumption') | float(0) %}
          {% set rate = states('sensor.mahavitran_current_unit_rate') | float(6.69) %}
          {{ (kwh * rate) | round(2) }}

      # --- DISHWASHER PROJECTED MONTHLY COST ENGINE ---
      - name: "Dishwasher Projected Monthly Cost INR"
        unique_id: dishwasher_projected_monthly_cost_inr
        icon: mdi:currency-inr
        unit_of_measurement: "INR"
        state: >-
          {% set energy = states('sensor.dishwasher_billing_cycle_energy') | float(0) %}
          {% set rate = states('sensor.mahavitran_current_unit_rate') | float(6.69) %}
          {% set current_day = now().day %}
          {% if current_day >= 7 %}
            {% set days = current_day - 7 + 1 %}
          {% else %}
            {% set prev_month_days = (now().replace(day=1) - timedelta(days=1)).day %}
            {% set days = prev_month_days - 7 + current_day + 1 %}
          {% endif %}
          {% set elapsed_days = days if days > 0.5 else 0.5 %}
          {% if states('sensor.dishwasher_billing_cycle_energy') not in ['unknown', 'unavailable'] and energy > 0.0 %}
            {% set current_cycle_cost = energy * rate %}
            {{ ((current_cycle_cost / elapsed_days) * 30.0) | round(2) }}
          {% else %}
            {% set fallback = states('sensor.dishwasher_projected_monthly_cost_inr') %}
            {{ fallback | float(0.0) if fallback not in ['unknown', 'unavailable', 'none'] else 0.00 }}
          {% endif %}

      # --- DISHWASHER DAILY ELECTRICITY COST ENGINE ---
      - name: "Dishwasher Daily Running Cost INR"
        unique_id: dishwasher_daily_running_cost_inr
        icon: mdi:currency-inr
        unit_of_measurement: "INR"
        state: >-
          {% set energy = states('sensor.dishwasher_daily_energy') | float(0) %}
          {% set rate = states('sensor.mahavitran_current_unit_rate') | float(6.69) %}
          {% if states('sensor.dishwasher_daily_energy') not in ['unknown', 'unavailable'] and energy > 0.0 %}
            {{ (energy * rate) | round(2) }}
          {% else %}
            {% set fallback = states('sensor.dishwasher_daily_running_cost_inr') %}
            {{ fallback | float(0.0) if fallback not in ['unknown', 'unavailable', 'none'] else 0.00 }}
          {% endif %}

      # --- DISHWASHER BILLING CYCLE RUNNING COST ENGINE ---
      - name: "Dishwasher Billing Cycle Running Cost INR"
        unique_id: dishwasher_billing_cycle_running_cost_inr
        icon: mdi:currency-inr
        unit_of_measurement: "INR"
        state: >-
          {% set energy = states('sensor.dishwasher_billing_cycle_energy') | float(0) %}
          {% set rate = states('sensor.mahavitran_current_unit_rate') | float(6.69) %}
          {% if states('sensor.dishwasher_billing_cycle_energy') not in ['unknown', 'unavailable'] and energy > 0.0 %}
            {{ (energy * rate) | round(2) }}
          {% else %}
            {% set fallback = states('sensor.dishwasher_billing_cycle_running_cost_inr') %}
            {{ fallback | float(0.0) if fallback not in ['unknown', 'unavailable', 'none'] else 0.00 }}
          {% endif %}

      # --- SAMSUNG WASHER PROJECTED MONTHLY COST ----
      - name: "Samsung Washer Projected Monthly Cost INR"
        unique_id: samsung_washer_projected_monthly_cost_inr
        icon: mdi:currency-inr
        unit_of_measurement: "INR"
        state: >-
          {% set energy = states('sensor.kitchen_washer_samsung_washer_monthly_energy') | float(0) %}
          {% set rate = states('sensor.mahavitran_current_unit_rate') | float(6.69) %}
          {% set current_day = now().day %}
          {% if current_day >= 7 %}
            {% set days = current_day - 7 + 1 %}
          {% else %}
            {% set prev_month_days = (now().replace(day=1) - timedelta(days=1)).day %}
            {% set days = prev_month_days - 7 + current_day + 1 %}
          {% endif %}
          {% set elapsed_days = days if days > 0.5 else 0.5 %}
          {% if states('sensor.kitchen_washer_samsung_washer_monthly_energy') not in ['unknown', 'unavailable'] and energy > 0.0 %}
            {% set current_cycle_cost = energy * rate %}
            {{ ((current_cycle_cost / elapsed_days) * 30.0) | round(2) }}
          {% else %}
            {% set fallback = states('sensor.samsung_washer_projected_monthly_cost_inr') %}
            {{ fallback | float(0.0) if fallback not in ['unknown', 'unavailable', 'none'] else 0.00 }}
          {% endif %}

      # --- SAMSUNG WASHER COST METRICS ---
      - name: "Washer Last Wash Cost INR"
        unique_id: washer_last_wash_cost_inr
        icon: mdi:currency-inr
        unit_of_measurement: "INR"
        state: >-
          {% set energy = states('sensor.samsung_washer_powercalc_energy') | float(0) %}
          {% set rate = states('sensor.mahavitran_current_unit_rate') | float(6.69) %}
          {{ (energy * rate) | round(2) }}

      - name: "Washer Today Running Cost INR"
        unique_id: washer_today_running_cost_inr
        icon: mdi:calendar-today
        unit_of_measurement: "INR"
        state: >-
          {% set energy = states('sensor.samsung_washer_powercalc_energy') | float(0) %}
          {% set rate = states('sensor.mahavitran_current_unit_rate') | float(6.69) %}
          {{ (energy * rate) | round(2) }}

      - name: "Washer Current Bill Cycle Cost INR"
        unique_id: washer_current_bill_cycle_cost_inr
        icon: mdi:calendar-month
        unit_of_measurement: "INR"
        state: >-
          {% set energy = states('sensor.kitchen_washer_samsung_washer_monthly_energy') | float(0) %}
          {% set rate = states('sensor.mahavitran_current_unit_rate') | float(6.69) %}
          {% if states('sensor.kitchen_washer_samsung_washer_monthly_energy') not in ['unknown', 'unavailable'] and energy > 0.0 %}
            {{ (energy * rate) | round(2) }}
          {% else %}
            {{ states('sensor.washer_current_bill_cycle_cost_inr') | float(0.0) }}
          {% endif %}

      # --- SAMSUNG WASHER INFERRED INITIAL RUNTIME ----
      - name: "Samsung Washer Initial Time"
        unique_id: samsung_washer_initial_time
        icon: mdi:clock-outline
        state: >-
          {% set job = states('sensor.washer_job_state') | default('') | trim | lower %}
          {% set temp = states('select.washer_water_temperature') | default('') | trim | lower %}
          {% if job in ['unavailable', 'unknown', 'none', 'finish', 'stopped', 'off'] or temp in ['none', 'unavailable', 'unknown'] %}
            0:00:00
          {% else %}
            {% if temp in ['60', '90'] %}
              02:15:00
            {% elif temp == '40' %}
              01:45:00
            {% else %}
              01:15:00
            {% endif %}
          {% endif %}

      # --- SAMSUNG WASHER COMPUTED REMAINING TIME ----
      - name: "Samsung Washer Remaining Time"
        unique_id: samsung_washer_remaining_time
        icon: mdi:timer-sand
        state: >-
          {% set job = states('sensor.washer_job_state') | default('') | trim | lower %}
          {% set completion = states('sensor.washer_completion_time') | default('') | trim %}
          {% if job not in ['unavailable', 'unknown', 'none', 'finish', 'stopped', 'off'] and completion not in ['unknown', 'unavailable', 'none', '', '-'] %}
            {% set total_seconds = (as_datetime(completion) - now()).total_seconds() %}
            {% if total_seconds > 0 %}
              {% set hours = (total_seconds // 3600) | int %}
              {% set minutes = ((total_seconds % 3600) // 60) | int %}
              {{ '%02d:%02d:00' | format(hours, minutes) }}
            {% else %}
              0:00:00
            {% endif %}
          {% else %}
            0:00:00
          {% endif %}

      # --- SAMSUNG WASHER TUB MAINTENANCE TRACKER ----
      - name: "Samsung Washer Tub Maintenance"
        unique_id: samsung_washer_tub_maintenance
        icon: mdi:sparkles
        state: >-
          {% set status = states('sensor.washer_display_status') | default('') | trim | lower %}
          {% set job = states('sensor.washer_job_state') | default('') | trim | lower %}
          {% if 'clean' in status or 'clean' in job or status in ['eco_tub_clean', 'tub_clean'] %}
            Required
          {% else %}
            OK
          {% endif %}

      # --- SONY TV DAILY ELECTRICITY COST ----
      - name: "Sony TV Daily Electricity Cost INR 2"
        unique_id: sony_tv_daily_electricity_cost_inr_2
        icon: mdi:currency-inr
        unit_of_measurement: "INR"
        state: >-
          {% set energy = states('sensor.living_room_tv_sony_tv_daily_energy_counter') | float(0) %}
          {% set rate = states('sensor.mahavitran_live_cost_per_unit') | float(6.68) %}
          {{ (energy * rate) | round(2) }}

      # --- SONY TV PROJECTED MONTHLY COST ----
      - name: "Sony TV Projected Monthly Cost INR"
        unique_id: sony_tv_projected_monthly_cost_inr
        icon: mdi:currency-inr
        unit_of_measurement: "INR"
        state: >-
          {% set daily_energy = states('sensor.living_room_tv_sony_tv_daily_energy_counter') | float(0) %}
          {% set rate = states('sensor.mahavitran_live_cost_per_unit') | float(6.68) %}
          {% set current_day = now().day %}
          {% if current_day >= 7 %}
            {% set days = current_day - 7 + 1 %}
          {% else %}
            {% set prev_month_days = (now().replace(day=1) - timedelta(days=1)).day %}
            {% set days = prev_month_days - 7 + current_day + 1 %}
          {% endif %}
          {% set elapsed_days = days if days > 0.5 else 0.5 %}
          {% set current_month_pace = (daily_energy / elapsed_days) * 30.0 %}
          {{ (current_month_pace * rate) | round(2) }}

      # --- SONY TV CUSTOM LIVE POWER METER ----
      - name: "Sony TV Custom Live Power"
        unique_id: sony_tv_custom_live_power_override
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >-
          {% set master_app = states('sensor.sony_tv_active_app') | default('') | trim %}
          {% if master_app in ['Off', 'unknown', 'unavailable', 'None', 'none', ''] %}
            0.0
          {% elif master_app == 'Home Screen' %}
            65.0
          {% elif master_app == 'Gaming Mode' %}
            125.0
          {% elif master_app in ['JioHotstar / Live TV', 'JioTv', 'Netflix', 'Prime Video', 'Castle'] %}
            110.0
          {% elif master_app in ['YouTube', 'Spotify'] %}
            85.0
          {% else %}
            65.0
          {% endif %}

      # --- MAHAVITRAN LIVE USAGE CONSOLIDATION CALCULATOR ---
      - name: "Mahavitran Current Month Usage Calculated"
        unique_id: mahavitran_current_month_usage_calculated
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        attributes:
          last_valid_usage: >-
            {% set tracker = states('sensor.living_room_mahavitran_smart_meter_170781431187_mahavitran_monthly_usage_tracker') | float(-1) %}
            {% if tracker >= 0.0 %}
              {{ tracker | round(2) }}
            {% else %}
              {% set self_state = states('sensor.mahavitran_current_month_usage_calculated') | float(-1) %}
              {{ self_state if self_state >= 0.0 else 0.0 }}
            {% endif %}
          data_status: >-
            {% set connection = states('sensor.mahavitran_smart_meter_170781431187_connection_status') | default('') | trim %}
            {% set tracker = states('sensor.living_room_mahavitran_smart_meter_170781431187_mahavitran_monthly_usage_tracker') | default('') %}
            {% if connection == 'Connected' and tracker not in ['unknown', 'unavailable', ''] and (tracker | float(-1)) >= 0.0 %}
              Live
            {% else %}
              Cached Fallback
            {% endif %}
          data_source: >-
            {% set connection = states('sensor.mahavitran_smart_meter_170781431187_connection_status') | default('') | trim %}
            {% set tracker = states('sensor.living_room_mahavitran_smart_meter_170781431187_mahavitran_monthly_usage_tracker') | default('') %}
            {% if connection == 'Connected' and tracker not in ['unknown', 'unavailable', ''] and (tracker | float(-1)) >= 0.0 %}
              Live
            {% else %}
              Cached
            {% endif %}
          last_tracker_update: >-
            {% if states('sensor.living_room_mahavitran_smart_meter_170781431187_mahavitran_monthly_usage_tracker') not in ['unknown','unavailable','none',''] %}
              {{ as_timestamp(states.sensor.living_room_mahavitran_smart_meter_170781431187_mahavitran_monthly_usage_tracker.last_changed) | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
            {% else %}
              -
            {% endif %}
          last_base_reading_update: >-
            {% if states('sensor.mahavitran_smart_meter_170781431187_current_reading') not in ['unknown','unavailable','none',''] %}
              {{ as_timestamp(states.sensor.mahavitran_smart_meter_170781431187_current_reading.last_changed) | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
            {% else %}
              -
            {% endif %}
        state: >-
          {% set base_reading = states('sensor.mahavitran_smart_meter_170781431187_current_reading') | float(-1) %}
          {% set anchor_reading = states('input_number.mahavitran_last_bill_reading') | float(-1) %}
          {% set tracker = states('sensor.living_room_mahavitran_smart_meter_170781431187_mahavitran_monthly_usage_tracker') | float(-1) %}
          {% if base_reading > 0.0 and anchor_reading > 0.0 and base_reading >= anchor_reading %}
            {{ (base_reading - anchor_reading) | round(2) }}
          {% elif tracker >= 0.0 %}
            {{ tracker | round(2) }}
          {% else %}
            {{ state_attr('sensor.mahavitran_current_month_usage_calculated', 'last_valid_usage') | float(0.0) }}
          {% endif %}

      # --- MAHAVITRAN AUGUST TRUE RESET ADJUSTMENT TRACKER ---
      - name: "Mahavitran Units Consumed Since Bill Date"
        unique_id: mahavitran_units_consumed_since_bill_date
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        attributes:
          dynamic_date_label: >-
            {% set dt = states('input_datetime.mahavitran_last_bill_date') | default('') %}
            {% if dt not in ['', 'unknown', 'unavailable'] %}
              Since {{ as_timestamp(dt) | timestamp_custom('%b %-d', true) }}
            {% else %}
              Since -
            {% endif %}
        state: >-
          {% set current_odo = states('sensor.mahavitran_smart_meter_170781431187_current_reading') | float(-1) %}
          {% if current_odo > 0.0 %}
            {{ (current_odo - 1437.0) | round(2) }}
          {% else %}
            {{ states('sensor.mahavitran_units_consumed_since_bill_date') | float(0.0) }}
          {% endif %}

      # --- MAHAVITRAN SUB-COMPONENT ENGINE: CORE ENERGY ---
      - name: "Mahavitran Core Energy Cost Calculated"
        unique_id: mahavitran_core_energy_cost_calculated
        unit_of_measurement: "INR"
        device_class: monetary
        state: >-
          {# Dynamic enterprise tier selection mapping #}
          {% set live_usage = states('sensor.mahavitran_current_month_usage_calculated') | float(-1) %}
          {% set true_august_usage = states('sensor.mahavitran_units_consumed_since_bill_date') | float(-1) %}
          {% set usage = true_august_usage if (live_usage >= 0.0 and live_usage < 5.0 and true_august_usage > live_usage) else live_usage %}
          {% if usage < 0.0 %}
            {{ states('sensor.mahavitran_core_energy_cost_calculated') | float(0.0) }}
          {% elif usage <= 100 %}
            {{ (usage * 3.96) | round(2) }}
          {% elif usage <= 300 %}
            {{ ((100 * 3.96) + ((usage - 100) * 10.80)) | round(2) }}
          {% elif usage <= 500 %}
            {{ ((100 * 3.96) + (200 * 10.80) + ((usage - 300) * 15.03)) | round(2) }}
          {% else %}
            {{ ((100 * 3.96) + (200 * 10.80) + (200 * 15.03) + ((usage - 500) * 17.53)) | round(2) }}
          {% endif %}

      # --- MAHAVITRAN SUB-COMPONENT ENGINE: WHEELING INFRA ---
      - name: "Mahavitran Wheeling Infra Cost Calculated"
        unique_id: mahavitran_wheeling_infra_cost_calculated
        unit_of_measurement: "INR"
        device_class: monetary
        state: >-
          {% set live_usage = states('sensor.mahavitran_current_month_usage_calculated') | float(-1) %}
          {% set true_august_usage = states('sensor.mahavitran_units_consumed_since_bill_date') | float(-1) %}
          {% set usage = true_august_usage if (live_usage >= 0.0 and live_usage < 5.0 and true_august_usage > live_usage) else live_usage %}
          {% if usage < 0.0 %}
            {{ states('sensor.mahavitran_wheeling_infra_cost_calculated') | float(0.0) }}
          {% else %}
            {{ (usage * 1.60) | round(2) }}
          {% endif %}

      # --- MAHAVITRAN SUB-COMPONENT ENGINE: FUEL SURCHARGE (FAC) ---
      - name: "Mahavitran Fuel Surcharge Cost Calculated"
        unique_id: mahavitran_fuel_surcharge_cost_calculated
        unit_of_measurement: "INR"
        device_class: monetary
        state: >-
          {% set live_usage = states('sensor.mahavitran_current_month_usage_calculated') | float(-1) %}
          {% set true_august_usage = states('sensor.mahavitran_units_consumed_since_bill_date') | float(-1) %}
          {% set usage = true_august_usage if (live_usage >= 0.0 and live_usage < 5.0 and true_august_usage > live_usage) else live_usage %}
          {% if usage < 0.0 %}
            {{ states('sensor.mahavitran_fuel_surcharge_cost_calculated') | float(0.0) }}
          {% elif usage <= 100 %}
            {{ (usage * 0.200) | round(2) }}
          {% elif usage <= 300 %}
            {{ ((100 * 0.200) + ((usage - 100) * 0.350)) | round(2) }}
          {% elif usage <= 500 %}
            {{ ((100 * 0.200) + (200 * 0.350) + ((usage - 300) * 0.500)) | round(2) }}
          {% else %}
            {{ ((100 * 0.200) + (200 * 0.350) + (200 * 0.500) + ((usage - 500) * 0.550)) | round(2) }}
          {% endif %}

      # --- POWERCALC COMPATIBLE: SMOOTH VARIABLE COST SCALAR ---
      - name: "Mahavitran Current Unit Rate"
        unique_id: mahavitran_current_unit_rate
        unit_of_measurement: "INR/kWh"
        state: >-
          {% set live_usage = states('sensor.mahavitran_current_month_usage_calculated') | float(0) %}
          {% set true_august_usage = states('sensor.mahavitran_units_consumed_since_bill_date') | float(0) %}
          {% set usage = true_august_usage if (live_usage >= 0.0 and live_usage < 5.0 and true_august_usage > live_usage) else live_usage %}
          {% set tax_rate = 0.16 %}
          {% set energy = states('sensor.mahavitran_core_energy_cost_calculated') | float(0) %}
          {% set wheeling = states('sensor.mahavitran_wheeling_infra_cost_calculated') | float(0) %}
          {% set fac = states('sensor.mahavitran_fuel_surcharge_cost_calculated') | float(0) %}
          {% if usage <= 0.0 %}
            {{ ((3.96 + 1.60 + 0.200) * (1 + tax_rate)) | round(2) }}
          {% else %}
            {% set dynamic_average_variable_rate = (energy + wheeling + fac) / usage %}
            {{ (dynamic_average_variable_rate * (1 + tax_rate)) | round(2) }}
          {% endif %}

      # --- MAHAVITRAN PROGRESSIVE BILL AGGREGATOR ----
      - name: "Mahavitran Estimated Monthly Bill"
        unique_id: mahavitran_estimated_monthly_bill
        unit_of_measurement: "INR"
        device_class: monetary
        state: >-
          {% set fixed_charge = 435.00 %}
          {% set government_subsidy = 42.50 %}
          {% set adjustments = 32.06 %}
          {% set tax_rate = 0.16 %}
          {% set energy = states('sensor.mahavitran_core_energy_cost_calculated') | float(0) %}
          {% set wheeling = states('sensor.mahavitran_wheeling_infra_cost_calculated') | float(0) %}
          {% set fac = states('sensor.mahavitran_fuel_surcharge_cost_calculated') | float(0) %}
          {% set base_taxable_subtotal = fixed_charge + energy + wheeling + fac %}
          {% set electricity_duty = base_taxable_subtotal * tax_rate %}
          {% set net_bill = base_taxable_subtotal + electricity_duty - government_subsidy - adjustments %}
          {{ net_bill | round(2) if net_bill > 0.0 else 0.00 }}
